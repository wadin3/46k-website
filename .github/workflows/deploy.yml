name: Build and deploy 46K website
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Read Pages deployment settings
        id: pages
        if: github.event_name != 'pull_request'
        uses: actions/configure-pages@v5
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Build and verify Astro site
        env:
          ASTRO_TELEMETRY_DISABLED: '1'
          ASTRO_SITE: ${{ steps.pages.outputs.origin || 'https://46k.com' }}
          ASTRO_BASE: ${{ steps.pages.outputs.base_path }}
        run: |
          node scripts/check-editorial.mjs
          npm run build
          python3 scripts/check-site.py --base "$ASTRO_BASE"
          python3 scripts/check-editorial.py
          python3 scripts/check-paper.py
          python3 scripts/check-intelligence.py
          python3 scripts/check-mission.py
          python3 scripts/check-assessment.py
          python3 scripts/check-connect.py
      - name: Save build output
        uses: actions/upload-artifact@v4
        with:
          name: 46k-site
          path: dist/
      - name: Verify project-path deployment
        if: github.event_name == 'pull_request'
        env:
          ASTRO_TELEMETRY_DISABLED: '1'
          ASTRO_SITE: https://wadin3.github.io
          ASTRO_BASE: /46k-website
        run: |
          npm run build
          python3 scripts/check-site.py --base "$ASTRO_BASE"
          python3 scripts/check-mission.py
          python3 scripts/check-paper.py
          python3 scripts/check-intelligence.py
          python3 scripts/check-assessment.py
          python3 scripts/check-connect.py
      - name: Upload Pages artifact
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist/
      - name: Check CMS-shaped edit and publication lifecycle
        if: github.event_name == 'pull_request'
        env:
          ASTRO_TELEMETRY_DISABLED: '1'
          ASTRO_SITE: https://46k-preview.invalid
          ASTRO_BASE: /46k-website
        run: node scripts/check-publication.mjs
      - name: Build editorial draft preview
        if: github.event_name == 'pull_request'
        env:
          ASTRO_TELEMETRY_DISABLED: '1'
          ASTRO_EDITORIAL_PREVIEW: '1'
          ASTRO_SITE: https://46k-preview.invalid
          ASTRO_BASE: /
        run: |
          npm run build
          python3 scripts/check-site.py
          python3 scripts/check-editorial.py --preview
          python3 scripts/check-paper.py
          python3 scripts/check-intelligence.py --preview
          python3 scripts/check-mission.py
          python3 scripts/check-assessment.py
          python3 scripts/check-connect.py
      - name: Save editorial preview
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: 46k-editorial-preview
          path: dist/

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
